<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4E7A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="市場雷達">
<title>市場雷達</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --font:"PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#F1F4F7; --card:#FFFFFF; --ink:#13212F; --muted:#586878; --line:#D8DFE6; --head:#F5F7F9;
  --accent:#1D4E7A; --accent-ink:#FFFFFF; --sel:#E6EFF8;
  --gold:#9A6A12; --gold-bg:#FBF3DF;
  --green:#0A7F58; --green-bg:#E1F4EB; --red:#BF3626; --red-bg:#FBE8E4; --flat:#586878; --flat-bg:#E7ECF0;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1620; --card:#16212D; --ink:#E7EDF3; --muted:#9AA9B8; --line:#2A3846; --head:#1B2836;
    --accent:#6BA6DE; --accent-ink:#0B1520; --sel:#1C3248;
    --gold:#E2B458; --gold-bg:#2A2214;
    --green:#43C795; --green-bg:#12302A; --red:#FF8672; --red-bg:#3A1F1B; --flat:#9AA9B8; --flat-bg:#243241;
  }
}
/* 漲跌顏色：gr = 綠漲紅跌，rg = 紅漲綠跌 */
body[data-color="gr"]{--up:var(--green);--up-bg:var(--green-bg);--down:var(--red);--down-bg:var(--red-bg)}
body[data-color="rg"]{--up:var(--red);--up-bg:var(--red-bg);--down:var(--green);--down-bg:var(--green-bg)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3,h4,p{margin:0}
small{color:var(--muted);font-size:12px}
.sub{color:var(--muted);font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;padding:12px 16px}
.brand{font-size:20px;font-weight:700;letter-spacing:.04em}
.top-actions{display:flex;align-items:center;gap:8px}
.top select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:44vw}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:40px;min-width:40px;cursor:pointer;font-size:18px}

.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin:0 auto;padding:0 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.gold{color:var(--gold)}
.tab.gold.on{border-bottom-color:var(--gold)}
.tab.add{font-weight:500}

main{max-width:1180px;margin:0 auto;padding:16px}
.panel,.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.result{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel-head h2{font-size:18px}
.notice{background:var(--gold-bg);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.text{border-color:transparent;background:none;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions.tight{margin-top:0}

.asks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.ask{text-align:left;display:grid;gap:2px;padding:14px 16px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer}
.ask b{font-size:16px}
.ask span{color:var(--muted);font-size:13px}
.ask.gold{border-color:var(--gold);background:var(--gold-bg)}
.ask:disabled{opacity:.5;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chip.on{border-color:var(--accent);background:var(--sel)}
.chip label{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 12px;min-height:40px;cursor:pointer}
.chip input{width:18px;height:18px;accent-color:var(--accent)}
.chip .x{border:0;background:none;color:var(--muted);padding:0 12px;min-height:40px;cursor:pointer}
.empty{color:var(--muted);margin:14px 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 220px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}

.res-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.res-head h3{font-size:18px}
.snap-title{display:none;margin-bottom:6px}
.cap{margin:18px 0 8px;font-size:15px}
.disc{margin-top:14px;color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tbody tr:last-child>*{border-bottom:0}
thead th{background:var(--head);color:var(--muted);font-weight:600;white-space:nowrap}
tbody th{font-weight:400}
.sticky,thead th:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
thead th:first-child{background:var(--head);z-index:2}
.sticky small{display:block}
.t-stock{min-width:940px}
.t-gold{min-width:720px}
.num{white-space:nowrap;text-align:right}
.long{min-width:220px}
.mid{min-width:160px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:6px;font-weight:600;white-space:nowrap}
.badge i{font-style:normal;font-size:11px}
.badge.up{color:var(--up);background:var(--up-bg)}
.badge.down{color:var(--down);background:var(--down-bg)}
.badge.flat{color:var(--flat);background:var(--flat-bg)}
.meter{display:inline-grid;gap:4px;min-width:84px;text-align:left}
.bar{display:block;height:6px;border-radius:3px;background:var(--flat-bg);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.cur{margin-right:3px}

.rotate-hint{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--gold-bg);border:1px solid var(--gold);font-size:14px}
.rotate-hint .btn{min-height:36px;padding:4px 12px}
@media (max-width:760px) and (orientation:portrait){.rotate-hint.show{display:flex}}

.loading{display:flex;align-items:center;gap:14px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err{border:1px solid var(--red);background:var(--red-bg);border-radius:8px;padding:12px 14px}
.err p{white-space:pre-line}
.err pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:8px 0 0}
.src{margin-top:12px;font-size:13px}
.src ul{margin:6px 0 0;padding-left:20px}
.src a{color:var(--accent)}

footer{max-width:1180px;margin:0 auto;padding:8px 16px 28px;color:var(--muted);font-size:12px}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,16,24,.55)}
.dlg{padding:18px;display:grid;gap:20px}
.dlg h3{font-size:16px;margin-bottom:8px}
.field{display:grid;gap:6px;margin-bottom:10px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>input{flex:1 1 180px}

#modelList{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.chipbtn{min-height:34px;padding:2px 10px;font-weight:500;font-size:13px}
.chipbtn.on{border-color:var(--accent);background:var(--sel)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}

/* 轉成圖片時使用的離屏版面 */
.snap{position:fixed;left:-10000px;top:0;width:1040px;padding:20px;background:var(--card);color:var(--ink)}
.snap .snap-title{display:block}
.snap .tablewrap{overflow:visible}
.snap .sticky,.snap thead th:first-child{position:static}

@media (max-width:600px){
  .panel,.result{padding:14px}
  table{font-size:13px}
  th,td{padding:8px 10px}
}
</style>
</head>
<body data-color="gr">

<header class="top">
  <div class="brand">市場雷達</div>
  <div class="top-actions">
    <select id="profileSel" aria-label="使用者"></select>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙</button>
  </div>
</header>

<nav id="tabs" class="tabs" aria-label="分類"></nav>

<main>
  <section id="panel" class="panel"></section>
  <section id="result" class="result" aria-live="polite" hidden></section>
</main>

<footer>AI 根據新聞推測，可能出錯，僅供參考，不是投資建議。<br>網頁版本 v6</footer>

<dialog id="dlg">
  <div class="dlg">
    <section>
      <h3>共用連線（通行碼）</h3>
      <p class="sub" style="margin-bottom:10px">用別人架好的 Worker，不需要自己的 API Key。通行碼只存在這個瀏覽器。</p>
      <div class="field">
        <label for="workerInput">Worker 網址（程式裡已填的話可留空）</label>
        <input id="workerInput" type="url" autocomplete="off" spellcheck="false" placeholder="https://xxx.workers.dev">
      </div>
      <div class="field">
        <label for="codeInput">通行碼</label>
        <div class="row">
          <input id="codeInput" type="password" autocomplete="off" spellcheck="false" placeholder="輸入通行碼">
          <button class="btn" id="codeToggle" type="button">顯示</button>
        </div>
      </div>
    </section>

    <section>
      <h3>或：直接用自己的 API Key</h3>
      <div class="field">
        <label for="keyInput">API Key（只存在這個瀏覽器，有填通行碼時會優先用通行碼）</label>
        <div class="row">
          <input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 AI Studio 的 Key">
          <button class="btn" id="keyToggle" type="button">顯示</button>
        </div>
      </div>
      <div class="field">
        <label for="modelInput">模型名稱</label>
        <div class="row">
          <input id="modelInput" type="text" autocomplete="off" spellcheck="false" placeholder="gemini-3.8-flash">
          <button class="btn" data-act="listModels" type="button">查詢可用模型</button>
        </div>
        <div id="modelList" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="colorSel">漲跌顏色</label>
        <select id="colorSel">
          <option value="gr">綠色代表上升，紅色代表下降</option>
          <option value="rg">紅色代表上升，綠色代表下降</option>
        </select>
      </div>
    </section>

    <section>
      <h3>使用者：<span id="profName"></span></h3>
      <p class="sub" style="margin-bottom:10px">每位使用者各自有 API Key 和分類，互不影響。</p>
      <div class="row">
        <button class="btn" data-act="addProfile" type="button">新增使用者</button>
        <button class="btn" data-act="renameProfile" type="button">改名</button>
        <button class="btn" data-act="delProfile" type="button">刪除這位使用者</button>
      </div>
    </section>

    <section>
      <h3>分類備份</h3>
      <p class="sub" style="margin-bottom:10px">分類會自動存在這個瀏覽器。要搬到另一台電話或電腦，先匯出，再到那邊匯入。</p>
      <div class="row">
        <button class="btn" data-act="exportCats" type="button">匯出分類</button>
        <button class="btn" data-act="importCats" type="button">匯入分類</button>
        <input id="fileImport" type="file" accept="application/json,.json" hidden>
      </div>
    </section>

    <form method="dialog"><button class="btn primary" style="width:100%">完成</button></form>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
let toastTimer;
function toast(m){
  const el = $('#toast'); el.textContent = m; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
const nowStr = () => new Date().toLocaleString('zh-TW', { hour12:false });

/* ---------- 使用者與資料 ---------- */
const MODEL_DEFAULT = 'gemini-3.8-flash';
// 部署 Cloudflare Worker 後，把它的網址貼在下面的引號裡。這個網址可以公開，沒有通行碼的人用不了。
const DEFAULT_WORKER_URL = 'https://market-radar.loveayame5777.workers.dev/';
const DEFAULT_CATS = [
  { id:'c1', name:'美股科技', stocks:['AAPL','NVDA','MSFT'] },
  { id:'c2', name:'馬股銀行', stocks:['Maybank 1155','Public Bank 1295'] }
];
let profiles = store.get('sa:profiles', null);
if(!Array.isArray(profiles) || !profiles.length) profiles = [{ id:'me', name:'我' }];
let currentId = store.get('sa:current', null);
if(!profiles.some(p => p.id === currentId)) currentId = profiles[0].id;
const pk = k => `sa:${currentId}:${k}`;
const getKey = () => String(store.get(pk('key'), '') || '').trim();
const getModel = () => String(store.get(pk('model'), '') || '').trim() || MODEL_DEFAULT;
const getWorker = () => String(store.get(pk('worker'), '') || '').trim() || DEFAULT_WORKER_URL;
const getCode = () => String(store.get(pk('code'), '') || '').trim();
const hasAccess = () => !!((getWorker() && getCode()) || getKey());
const getColor = () => store.get(pk('color'), 'gr');
const saveProfiles = () => { store.set('sa:profiles', profiles); store.set('sa:current', currentId); };

let cats = [];
let activeTab = 'gold';
let selected = new Set();
let busy = false;

const curCat = () => cats.find(c => c.id === activeTab);
const saveCats = () => store.set(pk('cats'), cats);
function resetSel(){ const c = curCat(); selected = new Set(c ? c.stocks : []); }
function loadProfile(){
  const saved = store.get(pk('cats'), null);
  cats = Array.isArray(saved) ? saved : JSON.parse(JSON.stringify(DEFAULT_CATS));
  if(!Array.isArray(saved)) saveCats();
  activeTab = 'gold'; selected = new Set();
  document.body.dataset.color = getColor() === 'rg' ? 'rg' : 'gr';
  $('#result').hidden = true; $('#result').innerHTML = '';
}

/* ---------- 畫面：頂部、分類、面板 ---------- */
function renderProfiles(){
  $('#profileSel').innerHTML = profiles.map(p => `<option value="${esc(p.id)}" ${p.id===currentId?'selected':''}>${esc(p.name)}</option>`).join('');
}
function renderTabs(){
  const t = [`<button class="tab gold ${activeTab==='gold'?'on':''}" data-tab="gold">黃金 / USD</button>`];
  cats.forEach(c => t.push(`<button class="tab ${activeTab===c.id?'on':''}" data-tab="${esc(c.id)}">${esc(c.name)}</button>`));
  t.push(`<button class="tab add" data-act="addCat">＋ 新分類</button>`);
  $('#tabs').innerHTML = t.join('');
}
function renderPanel(){
  const el = $('#panel');
  const why = getCode() && !getWorker() ? '已輸入通行碼，但缺少 Worker 網址。'
    : getWorker() && !getCode() ? '已有 Worker 網址，但還沒輸入通行碼。'
    : '還沒有連線設定。';
  const note = hasAccess() ? '' : `<div class="notice">${why}<button class="link" data-act="settings">到設定補上</button>（Worker 網址和通行碼都要有，或改填你自己的 API Key）。</div>`;
  if(activeTab === 'gold'){
    el.innerHTML = `${note}
      <div class="panel-head"><h2>黃金 / USD</h2></div>
      <p class="sub">選一個問題，AI 會搜尋過去 24 小時的新聞再回答。</p>
      <div class="asks">
        <button class="ask" data-ask="usd"><b>今天 USD 有新聞嗎？</b><span>列出 24 小時內會影響美元的重要新聞</span></button>
        <button class="ask gold" data-ask="gold"><b>黃金今天會升還是跌？</b><span>用 24 小時新聞推測，附建議買入價和賣出價</span></button>
      </div>`;
    return;
  }
  const c = curCat();
  if(!c){ activeTab = 'gold'; renderTabs(); renderPanel(); return; }
  const chips = c.stocks.map((s, i) => `
    <div class="chip ${selected.has(s)?'on':''}">
      <label><input type="checkbox" data-stock="${i}" ${selected.has(s)?'checked':''}><span>${esc(s)}</span></label>
      <button class="x" data-act="rmStock" data-i="${i}" aria-label="移除 ${esc(s)}">✕</button>
    </div>`).join('');
  el.innerHTML = `${note}
    <div class="panel-head">
      <h2>${esc(c.name)}</h2>
      <div class="row"><button class="btn text" data-act="renameCat">改名</button><button class="btn text" data-act="delCat">刪除分類</button></div>
    </div>
    ${c.stocks.length ? `<div class="chips">${chips}</div>` : `<p class="empty">這個分類還沒有股票。在下面輸入代號或名稱，例如 AAPL、Maybank 1155。</p>`}
    <form id="addStock" class="addrow" autocomplete="off">
      <input name="s" placeholder="加入股票（可用逗號一次加多支）" aria-label="加入股票">
      <button class="btn" type="submit">加入</button>
    </form>
    <div class="actions">
      <button class="btn primary" id="analyze" data-act="analyze"></button>
      <button class="btn" data-act="toggleAll">${selected.size === c.stocks.length && c.stocks.length ? '取消全選' : '全選'}</button>
    </div>`;
  updateAnalyze();
}
function updateAnalyze(){
  const b = $('#analyze'); if(!b) return;
  b.textContent = `分析所選股票（${selected.size}）`;
  b.disabled = busy || !selected.size;
}
function renderAll(){ renderProfiles(); renderTabs(); renderPanel(); }

/* ---------- Gemini ---------- */
async function callGemini(prompt){
  const worker = getWorker(), code = getCode(), key = getKey();
  const useWorker = !!(worker && code);
  if(!useWorker && !key){ openSettings(); throw new Error('請先在設定輸入通行碼，或你自己的 API Key。'); }
  const payload = {
    contents:[{ role:'user', parts:[{ text: prompt }] }],
    tools:[{ google_search:{} }],
    generationConfig:{ temperature:0.3 }
  };
  const headers = { 'Content-Type':'application/json' };
  let url;
  if(useWorker){
    url = worker; headers['x-access-code'] = code; payload.model = getModel();
  }else{
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(getModel())}:generateContent`;
    headers['x-goog-api-key'] = key;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try{
    res = await fetch(url, { method:'POST', headers, body: JSON.stringify(payload), signal: ctrl.signal });
  }catch(e){
    throw new Error(e.name === 'AbortError' ? '等太久了（超過 2 分鐘），請再試一次。' : '連不上伺服器，請檢查網路。');
  }finally{ clearTimeout(timer); }

  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const m = data?.error?.message || res.statusText || '';
    if(res.status === 400 && /api key/i.test(m)) throw new Error('API Key 無效，請到設定重新貼上。');
    if(res.status === 400) throw new Error('請求被拒絕：' + m);
    if(res.status === 401) throw new Error('通行碼不對，請到設定重新輸入。');
    if(res.status === 403) throw new Error('沒有權限：Key 被限制了，或這個網站不在 Worker 的允許名單內。');
    if(res.status === 404) throw new Error(`找不到模型「${getModel()}」（新帳號可能用不到舊模型）。請到設定按「查詢可用模型」，點一個清單裡有的。`);
    if(res.status === 429){
      const zero = /limit:\s*0/.test(m) ? '\n提示：「limit: 0」代表這個模型在免費版完全沒有額度，請換一個模型。' : '';
      throw new Error(`已達額度上限或請求太頻繁（目前模型：${getModel()}）。\nGoogle 的原話：${m.slice(0, 400)}${zero}\n可以過一會再試，或到設定按「查詢可用模型」換一個（例如名稱有 lite 的）。`);
    }
    if(res.status >= 500) throw new Error('Google 伺服器忙碌，稍後再試。');
    throw new Error(`錯誤 ${res.status}：${m}`);
  }
  if(data.promptFeedback?.blockReason) throw new Error('請求被安全機制擋下：' + data.promptFeedback.blockReason);
  const cand = data.candidates?.[0];
  const text = (cand?.content?.parts || []).map(p => p.text || '').join('').trim();
  if(!text) throw new Error('AI 沒有回傳內容，請再試一次。');
  const sources = (cand?.groundingMetadata?.groundingChunks || []).map(c => c.web).filter(Boolean);
  return { text, sources };
}
function extractJSON(text){
  const t = text.replace(/```json|```/gi, '').trim();
  const s = t.indexOf('{'), e = t.lastIndexOf('}');
  if(s < 0 || e <= s) throw new Error('AI 回覆的格式無法解析。');
  try{ return JSON.parse(t.slice(s, e + 1)); }
  catch{ throw new Error('AI 回覆的格式無法解析。'); }
}

/* ---------- 表格元件 ---------- */
function badge(t){
  const s = String(t ?? '');
  let c = 'flat', a = '●';
  if(/上升|利多|走強|看漲|上漲/.test(s)){ c = 'up'; a = '▲'; }
  else if(/下降|利空|走弱|看跌|下跌/.test(s)){ c = 'down'; a = '▼'; }
  return `<span class="badge ${c}"><i aria-hidden="true">${a}</i>${esc(s || '—')}</span>`;
}
function meter(p){
  if(p === null || p === undefined || p === '') return '—';
  const n = Math.round(Number(p));
  if(!Number.isFinite(n)) return esc(p);
  const v = Math.max(0, Math.min(100, n));
  return `<span class="meter"><b>${v}%</b><span class="bar"><span style="width:${v}%"></span></span></span>`;
}
function money(v, cur){
  if(v === null || v === undefined || v === '') return '—';
  const n = typeof v === 'number' ? v : Number(String(v).replace(/,/g, ''));
  const body = Number.isFinite(n) ? n.toLocaleString('en-US', { maximumFractionDigits:4 }) : esc(v);
  return `${cur ? `<small class="cur">${esc(cur)}</small>` : ''}${body}`;
}
function table(caption, cols, rows, cls = ''){
  const head = cols.map(c => `<th scope="col" class="${c.c || ''}">${esc(c.l)}</th>`).join('');
  const body = rows.map(r => `<tr>${r.map((x, i) =>
    i === 0 ? `<th scope="row" class="sticky">${x}</th>` : `<td class="${cols[i].c || ''}">${x}</td>`).join('')}</tr>`).join('');
  return `<h4 class="cap">${esc(caption)}</h4><div class="tablewrap" tabindex="0" role="region" aria-label="${esc(caption)}"><table class="${cls}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function srcHtml(src){
  const seen = new Set(), li = [];
  for(const s of src){
    if(!s?.uri || !/^https:\/\//.test(s.uri)) continue;
    const t = s.title || s.uri;
    if(seen.has(t)) continue; seen.add(t);
    li.push(`<li><a href="${esc(s.uri)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a></li>`);
    if(li.length >= 10) break;
  }
  return li.length ? `<details class="src"><summary>參考來源（${li.length}）</summary><ul>${li.join('')}</ul></details>` : '';
}

function setBusy(on){

  document.querySelectorAll('.ask').forEach(b => b.disabled = on);
  updateAnalyze();

async function run(kind){
  if(busy) return;
  let title, prompt, render;
  if(kind === 'stocks'){
    const list = [...selected];
    if(!list.length) return toast('先勾選至少一支股票');
    if(list.length > 10) return toast('一次最多分析 10 支，請取消一些');
    title = `${curCat().name}：${list.length} 支股票`; prompt = stockPrompt(list); render = renderStocks;
  }else if(kind === 'gold'){
    title = '黃金今日推測'; prompt = goldPrompt(); render = renderGold;
  }else{
    title = 'USD 今日新聞'; prompt = usdPrompt(); render = renderUsd;
  }
  setBusy(true); showLoading(title);
  let raw = '';
  try{
    const { text, sources } = await callGemini(prompt);
    raw = text;
    const body = render(extractJSON(text));
    showResult(title, body, sources);
  }catch(e){
    showError(e.message, raw);
  }finally{
    setBusy(false);
  }
}

/* ---------- 存圖、複製、橫向 ---------- */
async function savePng(){
  const src = $('#capture');
  if(!src) return;
  if(!window.html2canvas) return toast('圖片功能沒載入，請檢查網路後重新整理頁面');
  const wrap = document.createElement('div');
  wrap.className = 'snap';
  wrap.appendChild(src.cloneNode(true));
  document.body.appendChild(wrap);
  try{
    const bg = getComputedStyle(document.body).getPropertyValue('--card').trim() || '#ffffff';
    const canvas = await html2canvas(wrap, { scale:2, backgroundColor:bg });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], `market-radar-${Date.now()}.png`, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file] });
    }else{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  }catch(e){
    if(e.name !== 'AbortError') toast('存圖失敗：' + e.message);
  }finally{ wrap.remove(); }
}
async function copyText(){
  const cap = $('#capture'); if(!cap) return;
  const out = [$('#resTitle')?.textContent || ''];
  cap.querySelectorAll('.cap, tbody tr, thead tr').forEach(el => {
    out.push(el.classList.contains('cap') ? '\n' + el.textContent : [...el.children].map(c => c.innerText.replace(/\s+/g, ' ').trim()).join(' | '));
  });
  try{ await navigator.clipboard.writeText(out.join('\n')); toast('已複製'); }
  catch{ toast('這個瀏覽器不允許複製'); }
}
async function tryLandscape(){
  try{
    await document.documentElement.requestFullscreen();
    await screen.orientation.lock('landscape');
  }catch{
    const m = $('#hintMsg'); if(m) m.textContent = '這個瀏覽器不能自動轉向，請手動把手機轉成橫向。';
  }
}

      : await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers:{ 'x-goog-api-key': key } });

    store.set(pk('model'), t.dataset.model); $('#modelInput').value = t.dataset.model;
    document.querySelectorAll('#modelList [data-model]').forEach(b => b.classList.toggle('on', b === t));
    toast('已改用 ' + t.dataset.model); return;
  }
  if(t.dataset.tab){ activeTab = t.dataset.tab; resetSel(); renderTabs(); renderPanel(); return; }
  if(t.dataset.ask){ run(t.dataset.ask); return; }
  actions[t.dataset.act]?.(t);
});
document.addEventListener('change', e => {
  const cb = e.target.closest('input[data-stock]');
  if(!cb) return;
  const c = curCat(); if(!c) return;
  const s = c.stocks[+cb.dataset.stock];
  cb.checked ? selected.add(s) : selected.delete(s);
  cb.closest('.chip').classList.toggle('on', cb.checked);
  updateAnalyze();
});
document.addEventListener('submit', e => {
  if(e.target.id !== 'addStock') return;
  e.preventDefault();
  const c = curCat(); if(!c) return;
  const parts = e.target.elements.s.value.split(/[,，、\n]+/).map(s => s.trim().slice(0, 40)).filter(Boolean);
  let added = 0;
  for(const p of parts){
    if(c.stocks.some(x => x.toLowerCase() === p.toLowerCase())) continue;
    c.stocks.push(p); selected.add(p); added++;
  }
  if(added){ saveCats(); renderPanel(); $('#addStock input')?.focus(); }
  else e.target.elements.s.value = '';
});
$('#profileSel').addEventListener('change', e => switchProfile(e.target.value));
const saveField = (k, v) => {
  if(!store.set(pk(k), v.trim())) toast('瀏覽器擋住了儲存，請不要用無痕模式或 App 內建瀏覽器');
  renderPanel();
};
$('#workerInput').addEventListener('input', e => saveField('worker', e.target.value));
$('#codeInput').addEventListener('input', e => saveField('code', e.target.value));
$('#codeToggle').addEventListener('click', () => {
  const i = $('#codeInput'); const show = i.type === 'password';
  i.type = show ? 'text' : 'password'; $('#codeToggle').textContent = show ? '隱藏' : '顯示';
});
$('#keyInput').addEventListener('input', e => saveField('key', e.target.value));
$('#modelInput').addEventListener('input', e => store.set(pk('model'), e.target.value.trim()));
$('#colorSel').addEventListener('change', e => { store.set(pk('color'), e.target.value); document.body.dataset.color = e.target.value; });
$('#keyToggle').addEventListener('click', () => {
  const i = $('#keyInput'); const show = i.type === 'password';
  i.type = show ? 'text' : 'password'; $('#keyToggle').textContent = show ? '隱藏' : '顯示';
});
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) importCats(f); });
$('#dlg').addEventListener('close', () => renderPanel());

/* ---------- 啟動 ---------- */
saveProfiles();
loadProfile();
renderAll();
})();
</script>
</body>
</html>
